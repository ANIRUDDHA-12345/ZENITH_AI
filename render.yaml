services:
  - type: web
    name: zenith-ai-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: AI_PROVIDER
        value: openai-compatible
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: AI_MODEL
        value: baidu/ernie-5.5-flash-preview:free
      - key: CLIENT_ORIGIN
        value: https://aniruddha-12345.github.io
